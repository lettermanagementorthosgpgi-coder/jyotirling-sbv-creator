name: Create YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the uploaded source video"
        required: true
        type: string
      shorts_count:
        description: "Number of Shorts"
        required: true
        type: choice
        options: ["5", "7", "10"]
        default: "5"
      min_seconds:
        description: "Minimum duration in seconds"
        required: true
        type: choice
        options: ["10"]
        default: "10"
      max_seconds:
        description: "Maximum duration in seconds"
        required: true
        type: choice
        options: ["60"]
        default: "60"

permissions:
  contents: read

jobs:
  create-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f
      - name: Cache Hindi Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-medium-${{ runner.os }}-v1
          restore-keys: |
            whisper-medium-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run workflow unit tests
        run: python -m unittest discover -s tests -v
      - name: Download uploaded video from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p source_upload
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir source_upload
          python - <<'PY'
          from pathlib import Path
          allowed = {".mp4", ".mov", ".mkv", ".webm", ".m4v"}
          files = [p for p in Path("source_upload").iterdir()
                   if p.is_file() and p.suffix.lower() in allowed]
          if len(files) != 1:
              raise SystemExit(
                  f"Release must contain exactly one video file; found {len(files)}."
              )
          print(f"Selected source video: {files[0].name}")
          PY
      - name: Create Shorts review package
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHORTS_COUNT: ${{ inputs.shorts_count }}
          MIN_SECONDS: ${{ inputs.min_seconds }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          TRANSCRIPTION_PROVIDER: local
          TRANSCRIPTION_ALLOW_API_FALLBACK: "false"
          WHISPER_LANGUAGE: hi
          WHISPER_MODEL: medium
          WHISPER_COMPUTE_TYPE: int8
          WHISPER_CPU_THREADS: 4
          TRANSCRIPTION_CHUNK_SECONDS: 600
        run: |
          python -m src.shorts_creator \
            --file "$(find source_upload -maxdepth 1 -type f | head -n 1)" \
            --count "$SHORTS_COUNT" \
            --min-seconds "$MIN_SECONDS" \
            --max-seconds "$MAX_SECONDS"
      - name: Upload review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jyotirling-shorts-review
          path: shorts_work/jyotirling_shorts_review.zip
          if-no-files-found: error
          retention-days: 7
