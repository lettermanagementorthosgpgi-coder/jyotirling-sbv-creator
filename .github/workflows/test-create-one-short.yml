name: Test Create One Short

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the uploaded short test video"
        required: true
        type: string
        default: "title"

permissions:
  contents: read

jobs:
  create-one-test-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download uploaded video from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p source_upload
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir source_upload
          python - <<'PY'
          from pathlib import Path
          allowed = {".mp4", ".mov", ".mkv", ".webm", ".m4v"}
          files = [p for p in Path("source_upload").iterdir()
                   if p.is_file() and p.suffix.lower() in allowed]
          if len(files) != 1:
              raise SystemExit(
                  f"Release must contain exactly one video file; found {len(files)}."
              )
          print(f"Selected source video: {files[0].name}")
          PY
      - name: Create one 30-45 second test Short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m src.shorts_creator \
            --file "$(find source_upload -maxdepth 1 -type f | head -n 1)" \
            --count 1 \
            --min-seconds 30 \
            --max-seconds 45 \
            --allow-short-test
      - name: Upload test review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jyotirling-one-short-test-review
          path: shorts_work/jyotirling_shorts_review.zip
          if-no-files-found: error
          retention-days: 7
