name: Test Create Two Shorts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the uploaded test video"
        required: true
        type: string
        default: "ABCD"
      video_asset:
        description: "Exact video filename to use from the Release"
        required: true
        type: string
        default: "adhyay3.42rudra.mp4"

permissions:
  contents: read

jobs:
  create-two-test-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f
      - name: Cache local Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-small-${{ runner.os }}-v1
          restore-keys: |
            whisper-small-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download selected video from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VIDEO_ASSET: ${{ inputs.video_asset }}
        run: |
          mkdir -p source_upload
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir source_upload --pattern "$VIDEO_ASSET"
          python - <<'PY'
          import os
          from pathlib import Path
          selected = Path("source_upload") / os.environ["VIDEO_ASSET"]
          if not selected.is_file():
              raise SystemExit(f"Requested video asset was not found in Release: {selected.name}")
          print(f"Selected source video: {selected.name}")
          PY
      - name: Create two complete-thought test Shorts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSCRIPTION_PROVIDER: local
          TRANSCRIPTION_ALLOW_API_FALLBACK: "false"
          WHISPER_MODEL: small
          WHISPER_COMPUTE_TYPE: int8
          WHISPER_CPU_THREADS: 4
          TRANSCRIPTION_CHUNK_SECONDS: 600
        run: |
          python -u -m src.shorts_creator \
            --file "source_upload/${{ inputs.video_asset }}" \
            --count 2 \
            --min-seconds 10 \
            --max-seconds 60 \
            --allow-short-test
      - name: Upload two-Short review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jyotirling-two-shorts-test-review
          path: shorts_work/jyotirling_shorts_review.zip
          if-no-files-found: error
          retention-days: 7
