name: Test Create Two Shorts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the uploaded test video"
        required: true
        type: string
        default: "ABCD"
      video_asset:
        description: "Exact video filename to use from the Release"
        required: true
        type: string
        default: "adhyay3.42rudra.mp4"
      resume_run_id:
        description: "Optional previous run ID containing a saved AI quota checkpoint"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  create-two-test-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f
      - name: Cache local Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: whisper-small-${{ runner.os }}-v1
          restore-keys: |
            whisper-small-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download selected video from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VIDEO_ASSET: ${{ inputs.video_asset }}
        run: |
          mkdir -p source_upload
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > source_upload/release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          release = json.loads(Path("source_upload/release.json").read_text(encoding="utf-8"))
          asset_name = os.environ["VIDEO_ASSET"]
          asset = next((item for item in release.get("assets", []) if item.get("name") == asset_name), None)
          if asset is None:
              available = ", ".join(item.get("name", "") for item in release.get("assets", []))
              raise SystemExit(
                  f"Asset {asset_name!r} was not found in release {release.get('tag_name')!r}. "
                  f"Available assets: {available or '(none)'}"
              )

          destination = Path("source_upload") / asset_name
          request = Request(asset["browser_download_url"], headers={"User-Agent": "jyotirling-youtube-shorts"})
          print(f"Downloading release asset: {asset_name} ({asset.get('size', 0)} bytes)", flush=True)
          with urlopen(request, timeout=120) as response, destination.open("wb") as output:
              while True:
                  block = response.read(1024 * 1024)
                  if not block:
                      break
                  output.write(block)
          if not destination.is_file() or destination.stat().st_size != asset.get("size"):
              raise SystemExit(f"Downloaded asset size does not match GitHub release metadata: {destination}")
          print(f"Selected source video: {destination.name} ({destination.stat().st_size} bytes)", flush=True)
          PY
      - name: Restore AI checkpoint from previous run (optional)
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          mkdir -p ai_resume
          gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name jyotirling-ai-checkpoint --dir ai_resume
          if [ ! -s ai_resume/ai_selection_checkpoint.json ] && [ ! -d ai_resume/whisper_chunks ]; then
            echo "No resumable Whisper or AI checkpoint found in run $RESUME_RUN_ID"
            exit 1
          fi
          echo "Restored available Whisper/AI checkpoints from run $RESUME_RUN_ID"
      - name: Create two complete-thought test Shorts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSCRIPTION_PROVIDER: local
          TRANSCRIPTION_ALLOW_API_FALLBACK: "false"
          WHISPER_MODEL: small
          WHISPER_COMPUTE_TYPE: int8
          WHISPER_CPU_THREADS: 4
          TRANSCRIPTION_CHUNK_SECONDS: 600
        run: |
          RESUME_ARGS=()
          if [ -d ai_resume ]; then
            RESUME_ARGS+=(--resume-state ai_resume/ai_selection_checkpoint.json)
          fi
          python -u -m src.shorts_creator \
            --file "source_upload/${{ inputs.video_asset }}" \
            --count 2 \
            --min-seconds 10 \
            --max-seconds 60 \
            --allow-short-test \
            "${RESUME_ARGS[@]}"
      - name: Save latest Whisper and AI checkpoints for a later run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jyotirling-ai-checkpoint
          path: |
            shorts_work/ai_selection_checkpoint.json
            shorts_work/whisper_chunks/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove previous checkpoint only after the new one is safely uploaded
        if: always() && inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ inputs.resume_run_id }}
        run: |
          CURRENT_ARTIFACTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts")"
          CURRENT_ID="$(printf '%s' "$CURRENT_ARTIFACTS" | python -c 'import json,sys; d=json.load(sys.stdin); print(next((str(a["id"]) for a in d.get("artifacts",[]) if a.get("name")=="jyotirling-ai-checkpoint" and not a.get("expired")), ""))')"
          if [ -z "$CURRENT_ID" ]; then
            echo "New checkpoint artifact is missing; previous checkpoint will be kept."
            exit 0
          fi
          PREVIOUS_ARTIFACTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN_ID/artifacts")"
          printf '%s' "$PREVIOUS_ARTIFACTS" | python -c 'import json,sys; d=json.load(sys.stdin); [print(a["id"]) for a in d.get("artifacts",[]) if a.get("name")=="jyotirling-ai-checkpoint" and not a.get("expired")]' | while read -r artifact_id; do
            echo "Deleting superseded checkpoint artifact $artifact_id from run $PREVIOUS_RUN_ID"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          done

      - name: Upload two-Short review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jyotirling-two-shorts-test-review
          path: shorts_work/jyotirling_shorts_review.zip
          if-no-files-found: error
          retention-days: 7
