name: Check YouTube Video (Metadata Only)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Link to your own completed YouTube Live/video"
        required: true
        type: string
        default: "https://www.youtube.com/live/cuB79CZGVRw"

permissions:
  contents: read

jobs:
  check-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Read video metadata only (no download)
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          yt-dlp --dump-single-json --skip-download --no-warnings --no-playlist "$VIDEO_URL" > video_info.json
          python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("video_info.json").read_text(encoding="utf-8"))
          duration = info.get("duration")
          size = info.get("filesize") or info.get("filesize_approx")
          print("METADATA_CHECK_OK")
          print(f"TITLE: {info.get('title') or 'Not provided'}")
          print(f"VIDEO_ID: {info.get('id') or 'Not provided'}")
          print(f"DURATION_SECONDS: {duration if duration is not None else 'Not provided'}")
          if duration is not None:
              print(f"DURATION_MINUTES: {duration / 60:.1f}")
          print(f"ESTIMATED_SIZE_BYTES: {size if size is not None else 'Not provided'}")
          print(f"AVAILABLE_FORMATS: {len(info.get('formats') or [])}")
          print("DOWNLOAD_PERFORMED: no")
          print("GEMINI_API_CALLED: no")
          PY
