name: Test GitHub Release Video Download

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag containing the test video"
        required: true
        type: string
        default: "title"

permissions:
  contents: read

jobs:
  test-download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Download video from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -p source_upload
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir source_upload
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess

          allowed = {".mp4", ".mov", ".mkv", ".webm", ".m4v"}
          files = [p for p in Path("source_upload").iterdir()
                   if p.is_file() and p.suffix.lower() in allowed]
          if len(files) != 1:
              raise SystemExit(
                  f"Expected exactly one video file; found {len(files)}."
              )

          video = files[0]
          size = video.stat().st_size
          digest = hashlib.sha256(video.read_bytes()).hexdigest()
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries",
               "format=duration", "-of", "default=noprint_wrappers=1:nokey=1",
               str(video)],
              check=True, capture_output=True, text=True
          )
          duration = float(probe.stdout.strip())
          print(f"DOWNLOAD_OK: {video.name}")
          print(f"SIZE_BYTES: {size}")
          print(f"DURATION_SECONDS: {duration:.2f}")
          print(f"SHA256: {digest}")
          PY
