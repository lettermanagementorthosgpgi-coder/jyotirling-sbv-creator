name: Repair Two YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag containing the original source video"
        required: true
        type: string
        default: "15.11.2026"
      first_start:
        description: "First Short original start (source seconds)"
        required: true
        type: string
        default: "3888.8"
      first_end:
        description: "First Short original end (source seconds)"
        required: true
        type: string
        default: "3899.6"
      second_start:
        description: "Second Short original start (source seconds)"
        required: true
        type: string
        default: "4358.2"
      second_end:
        description: "Second Short original end (source seconds)"
        required: true
        type: string
        default: "4372.5"

permissions:
  contents: read

jobs:
  repair-two-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Hindi fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -f
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download original source video from existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p source_upload
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir source_upload
          python - <<'PY'
          from pathlib import Path
          allowed = {".mp4", ".mov", ".mkv", ".webm", ".m4v"}
          videos = [p for p in Path("source_upload").iterdir()
                    if p.is_file() and p.suffix.lower() in allowed]
          if len(videos) != 1:
              raise SystemExit(f"Expected exactly one source video; found {len(videos)}.")
          print(f"Using existing source video: {videos[0].name}")
          PY
      - name: Re-transcribe and repair only the two target regions
        env:
          WHISPER_LANGUAGE: hi
          WHISPER_MODEL: small
          WHISPER_COMPUTE_TYPE: int8
          TRANSCRIPTION_PROVIDER: local
          FIRST_START: ${{ inputs.first_start }}
          FIRST_END: ${{ inputs.first_end }}
          SECOND_START: ${{ inputs.second_start }}
          SECOND_END: ${{ inputs.second_end }}
        run: |
          python -m src.repair_shorts \
            --file "$(find source_upload -maxdepth 1 -type f | head -n 1)" \
            --first-start "$FIRST_START" --first-end "$FIRST_END" \
            --second-start "$SECOND_START" --second-end "$SECOND_END"
      - name: Upload repaired review ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jyotirling-repaired-two-shorts
          path: shorts_work/jyotirling-repaired-two-shorts.zip
          if-no-files-found: error
          retention-days: 7
